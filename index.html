<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFEBDD;
    --ink:#26302A;
    --primary:#1F4B3F;
    --accent:#A9812E;
    --correct:#3C7A54;
    --incorrect:#A23B2E;
    --neutral:#8A7B3E;
    --line:#D9D3BE;
    --paper-2:#F7F5EC;
  }

    background:var(--paper);
    color:var(--ink);
    font-family:'Tajawal',sans-serif;
    line-height:1.9;
    padding:28px 14px 80px;
  }
  .sheet{
    max-width:700px;
    margin:0 auto;
    background:var(--paper-2);
    border-top:3px double var(--accent);
    border-bottom:3px double var(--accent);
    padding:34px 28px 44px;

  .ornament{

    font-family:'Amiri',serif;

  .sub{
    text-align:center;

    font-size:.92rem;
    margin-bottom:28px;
  }

  .part-title{
    font-family:'Amiri',serif;

    color:var(--primary);

    border-bottom:1px solid var(--line);

  .q-prompt{

    font-size:1.15rem;

  .q textarea, .q input[type=text]{
    width:100%;
    font-family:'Amiri',serif;
    font-size:1.1rem;
    border:1px solid var(--line);

    border-radius:2px;
    padding:9px 12px;
    resize:vertical;
    color:var(--ink);
  }
  .q textarea:focus, .q input[type=text]:focus{
    outline:none;
    border-color:var(--primary);
  }
  .feedback{
    margin-top:10px;
    font-size:.92rem;
    display:none;
    padding-right:10px;
    border-right:3px solid transparent;
  }
  .feedback.show{display:block;}
  .feedback .tag{
    font-weight:700;
    display:inline-block;
    margin-bottom:3px;
  }
  .q.correct{border-right:3px solid var(--correct);}
  .q.incorrect{border-right:3px solid var(--incorrect);}
  .q.neutral{border-right:3px solid var(--neutral);}
  .q.correct .feedback .tag{color:var(--correct);}
  .q.incorrect .feedback .tag{color:var(--incorrect);}
  .q.neutral .feedback .tag{color:var(--neutral);}

  .actions{

    margin-top:34px;

  }
  button{

    font-weight:700;

    padding:12px 30px;
    border:none;
    border-radius:3px;

  #gradeBtn{background:var(--primary);color:#fff;}
  #gradeBtn:hover{background:#173a30;}
  #resetBtn{background:transparent;color:var(--ink);border:1px solid var(--line);}
  #resetBtn:hover{border-color:var(--ink);}
  #printBtn{background:transparent;color:var(--accent);border:1px solid var(--accent);}

  #result{

    margin:0 0 30px;
    text-align:center;
    padding:22px;
    background:var(--paper);
    border:1px solid var(--line);

  @keyframes reveal{to{opacity:1;transform:translateY(0);}}

    color:var(--primary);

  #result .pct{

  }

    color:#6b6558;
    margin-top:10px;

    .sheet{border:none;padding:0;}
    .actions{display:none;}
    textarea,input[type=text]{border:none !important;background:transparent !important;}

<body>
<div class="sheet">
  <div class="ornament"></div>
  <h1>اختبار حفظ وفهم – الصفحة الرابعة من سورة البقرة</h1>
  <div class="sub">الآيات 25 – 29</div>

    <div>
      <label>الاسم</label>

  </div>

  <div class="actions">
    <button id="gradeBtn">صحّح الاختبار</button>

    <button id="printBtn" type="button">طباعة / حفظ PDF</button>
  </div>
</div>

<script>
/* ============ تطبيع النص العربي ============ */
function normalize(text){
  if(!text) return '';
  return text
    .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u08F0-\u08FF]/g,'')
    .replace(/\u0640/g,'')
    .replace(/[إأآا]/g,'ا')
    .replace(/ى/g,'ي')
    .replace(/ة/g,'ه')
    .replace(/[ؤئء]/g,'')
    .replace(/[﴿﴾۝.,،؟!:\-–—()]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

function levenshtein(a,b){
  const m=a.length,n=b.length;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      if(a[i-1]===b[j-1]) dp[i][j]=dp[i-1][j-1];
      else dp[i][j]=1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}

function wordsFuzzyMatch(w1,w2){
  if(w1===w2) return true;
  const ref = w2.length>=w1.length ? w2 : w1;
  const threshold = ref.length<=3 ? 1 : Math.max(1,Math.floor(ref.length*0.28));
  return levenshtein(w1,w2)<=threshold;
}

function containsPhrase(answerNorm, phraseNorm){
  const a = answerNorm.split(' ').filter(Boolean);
  const p = phraseNorm.split(' ').filter(Boolean);
  if(p.length===0) return false;
  for(let i=0;i<=a.length-p.length;i++){
    let ok=true;
    for(let j=0;j<p.length;j++){
      if(!wordsFuzzyMatch(a[i+j],p[j])){ok=false;break;}
    }
    if(ok) return true;
  }
  if(p.length===1){
    return a.some(w => w.includes(p[0]) || (p[0].length>=3 && wordsFuzzyMatch(w,p[0])));
  }
  return false;
}

function countPoints(raw){
  const parts = raw
    .split(/\n|؛|•|-|،(?=\s*\d)|(?:^|\s)\d+[\).]/g)
    .map(s=>s.trim())
    .filter(s=>s.length>=8 && s.split(/\s+/).length>=3);
  if(parts.length>=2) return parts.length;
  return raw.trim().length>=8 ? 1 : 0;
}

/* ============ بيانات الأسئلة – الصفحة الرابعة ============ */
const questions = [
{part:'أولًا: أكمل قوله تعالى', id:1, type:'phrase',
  prompt:'﴿وَبَشِّرِ الَّذِينَ ...﴾ .... إلى .... ﴿...وَهُمْ فِيهَا خَالِدُونَ﴾',
  accept:['امنوا وعملوا الصالحات','الصالحات'],
  full:'وَبَشِّرِ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ أَنَّ لَهُمْ جَنَّاتٍ تَجْرِي مِنْ تَحْتِهَا الْأَنْهَارُ كُلَّمَا رُزِقُوا مِنْهَا مِنْ ثَمَرَةٍ رِزْقًا قَالُوا هَذَا الَّذِي رُزِقْنَا مِنْ قَبْلُ وَأُتُوا بِهِ مُتَشَابِهًا وَلَهُمْ فِيهَا أَزْوَاجٌ مُطَهَّرَةٌ وَهُمْ فِيهَا خَالِدُونَ'},

{id:2, type:'phrase',
  prompt:'﴿إِنَّ اللَّهَ لَا يَسْتَحْيِي أَنْ ...﴾ .... إلى .... ﴿...إِلَّا الْفَاسِقِينَ﴾',
  accept:['يضرب مثلا','يضرب'],
  full:'إِنَّ اللَّهَ لَا يَسْتَحْيِي أَنْ يَضْرِبَ مَثَلًا مَا بَعُوضَةً فَمَا فَوْقَهَا فَأَمَّا الَّذِينَ آمَنُوا فَيَعْلَمُونَ أَنَّهُ الْحَقُّ مِنْ رَبِّهِمْ وَأَمَّا الَّذِينَ كَفَرُوا فَيَقُولُونَ مَاذَا أَرَادَ اللَّهُ بِهَذَا مَثَلًا يُضِلُّ بِهِ كَثِيرًا وَيَهْدِي بِهِ كَثِيرًا وَمَا يُضِلُّ بِهِ إِلَّا الْفَاسِقِينَ'},

{id:3, type:'phrase',
  prompt:'﴿الَّذِينَ يَنْقُضُونَ ...﴾ .... إلى .... ﴿...هُمُ الْخَاسِرُونَ﴾',
  accept:['عهد الله من بعد ميثاقه','عهد الله'],
  full:'الَّذِينَ يَنْقُضُونَ عَهْدَ اللَّهِ مِنْ بَعْدِ مِيثَاقِهِ وَيَقْطَعُونَ مَا أَمَرَ اللَّهُ بِهِ أَنْ يُوصَلَ وَيُفْسِدُونَ فِي الْأَرْضِ أُولَئِكَ هُمُ الْخَاسِرُونَ'},

{id:4, type:'phrase',
  prompt:'﴿كَيْفَ تَكْفُرُونَ بِاللَّهِ...﴾ .... إلى .... ﴿...ثُمَّ إِلَيْهِ تُرْجَعُونَ﴾',
  accept:['وكنتم امواتا','امواتا'],
  full:'كَيْفَ تَكْفُرُونَ بِاللَّهِ وَكُنْتُمْ أَمْوَاتًا فَأَحْيَاكُمْ ثُمَّ يُمِيتُكُمْ ثُمَّ يُحْيِيكُمْ ثُمَّ إِلَيْهِ تُرْجَعُونَ'},

{id:5, type:'phrase',
  prompt:'﴿هُوَ الَّذِي خَلَقَ لَكُمْ مَا ...﴾ .... إلى .... ﴿...وَهُوَ بِكُلِّ شَيْءٍ عَلِيمٌ﴾',
  accept:['في الارض جميعا','جميعا'],
  full:'هُوَ الَّذِي خَلَقَ لَكُمْ مَا فِي الْأَرْضِ جَمِيعًا ثُمَّ اسْتَوَى إِلَى السَّمَاءِ فَسَوَّاهُنَّ سَبْعَ سَمَاوَاتٍ وَهُوَ بِكُلِّ شَيْءٍ عَلِيمٌ'},

{part:'ثانيًا: ما الكلمة التي جاءت...', id:6, type:'phrase',
  prompt:'ما الكلمة التي جاءت بعد: ﴿وَعَمِلُوا﴾؟',
  accept:['الصالحات'], full:'الصَّالِحَاتِ'},

{id:7, type:'phrase',
  prompt:'ما الكلمة التي جاءت قبل: ﴿الْفَاسِقِينَ﴾؟',
  accept:['الا'], full:'إِلَّا'},

{part:'ثالثًا: صحح الكلمة الخاطئة', id:8, type:'phrase',
  prompt:'﴿وَبَشِّرِ الَّذِينَ آمَنُوا وَعَمِلُوا السَّيِّئَاتِ﴾',
  accept:['الصالحات'],
  full:'الصواب: الصَّالِحَاتِ (بدل السَّيِّئَاتِ) — ﴿وَبَشِّرِ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ﴾'},

{id:9, type:'phrase',
  prompt:'﴿كُلَّمَا رُزِقُوا مِنْهَا مِنْ ثَمَرَةٍ رِزْقًا قَالُوا هَذَا الَّذِي رُزِقْنَا مِنْ بَعْدُ﴾',
  accept:['قبل'],
  full:'الصواب: مِنْ قَبْلُ (بدل مِنْ بَعْدُ) — ﴿قَالُوا هَذَا الَّذِي رُزِقْنَا مِنْ قَبْلُ﴾'},

{id:10, type:'phrase',
  prompt:'﴿وَيَقْطَعُونَ مَا أَمَرَ اللَّهُ بِهِ أَنْ يُقْطَعَ﴾',
  accept:['يوصل'],
  full:'الصواب: أَنْ يُوصَلَ (بدل أَنْ يُقْطَعَ) — ﴿وَيَقْطَعُونَ مَا أَمَرَ اللَّهُ بِهِ أَنْ يُوصَلَ﴾'},

{id:11, type:'phrase',
  prompt:'﴿كَيْفَ تَكْفُرُونَ بِاللَّهِ وَكُنْتُمْ أَحْيَاءً فَأَحْيَاكُمْ﴾',
  accept:['امواتا'],
  full:'الصواب: أَمْوَاتًا (بدل أَحْيَاءً) — ﴿كَيْفَ تَكْفُرُونَ بِاللَّهِ وَكُنْتُمْ أَمْوَاتًا فَأَحْيَاكُمْ﴾'},

{part:'رابعًا: اكتب', id:12, type:'phrase',
  prompt:'اكتب آية فيها ذكر أزواج أهل الجنة',
  accept:['ازواج مطهرة','مطهرة'],
  full:'﴿وَلَهُمْ فِيهَا أَزْوَاجٌ مُطَهَّرَةٌ وَهُمْ فِيهَا خَالِدُونَ﴾'},

{id:13, type:'phrase',
  prompt:'اكتب آية فيها ذكر خلق السماوات السبع',
  accept:['سبع سماوات','سبع'],
  full:'﴿ثُمَّ اسْتَوَى إِلَى السَّمَاءِ فَسَوَّاهُنَّ سَبْعَ سَمَاوَاتٍ﴾'},

{part:'خامسًا: رتب الكلمات', id:14, type:'phrase',
  prompt:'(مطهرة – أزواج – فيها – ولهم)',
  accept:['ولهم فيها ازواج مطهرة'], full:'وَلَهُمْ فِيهَا أَزْوَاجٌ مُطَهَّرَةٌ'},

{id:15, type:'phrase',
  prompt:'(الخاسرون – أولئك – هم)',
  accept:['اولئك هم الخاسرون'], full:'أُولَئِكَ هُمُ الْخَاسِرُونَ'},

{part:'سادسًا: اكتب الكلمة الناقصة', id:16, type:'phrase',
  prompt:'﴿وَبَشِّرِ الَّذِينَ آمَنُوا وَعَمِلُوا ________﴾',
  accept:['الصالحات'], full:'الصَّالِحَاتِ'},

{id:17, type:'phrase',
  prompt:'﴿وَلَهُمْ فِيهَا أَزْوَاجٌ ________﴾',
  accept:['مطهرة'], full:'مُطَهَّرَةٌ'},

{id:18, type:'phrase',
  prompt:'﴿الَّذِينَ يَنْقُضُونَ عَهْدَ اللَّهِ مِنْ بَعْدِ ________﴾',
  accept:['ميثاقه'], full:'مِيثَاقِهِ'},

{id:19, type:'phrase',
  prompt:'﴿فَسَوَّاهُنَّ ________ سَمَاوَاتٍ﴾',
  accept:['سبع'], full:'سَبْعَ'},

{part:'سابعًا: فهم الآيات', id:20, type:'reflection', required:2,
  prompt:'ما الفوائد التي تعلمتها من هذه الصفحة؟ اذكر فائدتين باختصار.',
  full:'أمثلة على فوائد مقبولة: بشارة أهل الإيمان والعمل الصالح بالجنة، ضرب الله الأمثال ولو بأشياء صغيرة كالبعوضة، خطورة نقض العهد والإفساد في الأرض، التذكير بنعمة الإحياء بعد الإماتة، وعظمة خلق الله للسماوات والأرض.'}
];

/* ============ بناء الأسئلة في الصفحة ============ */
const quizEl = document.getElementById('quiz');
questions.forEach(q=>{
  if(q.part){
    const h = document.createElement('div');
    h.className='part-title';
    h.textContent = q.part;
    quizEl.appendChild(h);
  }
  const wrap = document.createElement('div');
  wrap.className='q';
  wrap.id = 'q'+q.id;
  const isLong = q.type==='reflection';
  wrap.innerHTML = `
    <div class="q-prompt"><span class="q-num">${q.id}.</span>${q.prompt}</div>
    ${isLong
      ? `<textarea rows="3" data-qid="${q.id}" placeholder="اكتب إجابتك هنا (فائدة في كل سطر)..."></textarea>`
      : `<input type="text" data-qid="${q.id}" placeholder="اكتب إجابتك هنا...">`}
    <div class="feedback" id="fb${q.id}"></div>
  `;
  quizEl.appendChild(wrap);
});

/* ============ التصحيح ============ */
document.getElementById('gradeBtn').addEventListener('click', ()=>{
  let score = 0;
  questions.forEach(q=>{
    const el = document.querySelector(`[data-qid="${q.id}"]`);
    const raw = el.value || '';
    const norm = normalize(raw);
    const qWrap = document.getElementById('q'+q.id);
    const fb = document.getElementById('fb'+q.id);
    let correct = false;
    let extra = '';

    if(q.type==='phrase'){
      correct = q.accept.some(acc => containsPhrase(norm, normalize(acc)));
    } else if(q.type==='reflection'){
      const pts = countPoints(raw.trim());
      correct = pts >= (q.required||2);
      extra = correct
        ? 'تم رصد نقطتين مختلفتين تقريبًا — يُفضّل أن يراجع المعلم مضمونهما.'
        : 'يبدو أن الإجابة تحتوي نقطة واحدة فقط. يُطلب ذكر فائدتين منفصلتين (كل واحدة في سطر).';
    }

    qWrap.classList.remove('correct','incorrect','neutral');
    fb.classList.add('show');

    if(raw.trim()===''){
      qWrap.classList.add('incorrect');
      fb.innerHTML = `<span class="tag">لم تتم الإجابة —</span> ${q.type==='reflection' ? 'يُطلب ذكر فائدتين.' : `الإجابة الصحيحة: <span class="correct-ans">${q.full}</span>`}`;
    } else if(q.type==='reflection'){
      if(correct) score++;
      qWrap.classList.add('neutral');
      fb.innerHTML = `<span class="tag">${correct ? 'إجابة مقبولة شكليًا (بحاجة مراجعة) ⚠' : 'غير مكتملة'}</span><br>${extra}<br><span class="correct-ans">${q.full}</span>`;
    } else if(correct){
      score++;
      qWrap.classList.add('correct');
      fb.innerHTML = `<span class="tag">إجابة صحيحة ✓</span>`;
    } else {
      qWrap.classList.add('incorrect');
      fb.innerHTML = `<span class="tag">غير دقيقة —</span> الإجابة الصحيحة: <span class="correct-ans">${q.full}</span>`;
    }
  });

  const resultEl = document.getElementById('result');
  resultEl.classList.remove('show');
  void resultEl.offsetWidth;
  resultEl.classList.add('show');
  document.getElementById('scoreText').textContent = `${score} / 20`;
  const pct = Math.round((score/20)*100);
  document.getElementById('pctText').textContent = `النسبة: ${pct}%`;
  resultEl.scrollIntoView({behavior:'smooth', block:'start'});
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  document.querySelectorAll('.q input, .q textarea').forEach(el=>el.value='');
  document.querySelectorAll('.q').forEach(el=>el.classList.remove('correct','incorrect','neutral'));
  document.querySelectorAll('.feedback').forEach(el=>{el.classList.remove('show'); el.innerHTML='';});
  document.getElementById('result').classList.remove('show');
  document.getElementById('studentName').value='';
});

document.getElementById('printBtn').addEventListener('click', ()=> window.print());
</script>
</body>
</html>
